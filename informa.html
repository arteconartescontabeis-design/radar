<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artecon Informa — Inteligência Contábil e Tributária</title>
<meta name="description" content="Informativos da Artecon Artes Contábeis sobre Reforma Tributária, Simples Nacional, tributos federais e de Santa Catarina, com fundamentação em fontes oficiais.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{ --marinho:#011F48; --azul:#569DCC; --azul-claro:#E8F1F9; --vermelho:#BC151B; --cinza:#4F4C4D; --linha:#E3E7EC; --fundo:#FBFEFE; }
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"DM Sans",system-ui,sans-serif;color:var(--cinza);background:var(--fundo);font-size:17px;line-height:1.6}
a{color:#1B5E9B}
.topo{background:linear-gradient(90deg,var(--marinho),#1B5E9B);border-bottom:3px solid var(--azul);color:#fff;padding:22px 16px}
main{overflow-wrap:anywhere}
.topo .dentro,main,.rodape .dentro{max-width:860px;margin:0 auto}
.topo a{color:#fff;text-decoration:none}
.marca{font-family:"Playfair Display",Georgia,serif;font-size:1.9rem;font-weight:700;line-height:1.1}
.lema{opacity:.9;font-size:.95rem}
nav.cats{background:#fff;border-bottom:1px solid var(--linha)}
nav.cats .dentro{max-width:860px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 10px}
nav.cats a{padding:11px 10px;white-space:nowrap;text-decoration:none;color:var(--cinza);border-bottom:3px solid transparent;font-size:.93rem}
nav.cats a.ativa{border-bottom-color:var(--vermelho);color:var(--marinho);font-weight:700}
main{padding:24px 16px 50px}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;color:var(--marinho);line-height:1.25}
h1{font-size:1.9rem;margin:.2em 0 .4em} h2{font-size:1.35rem} h3{font-size:1.15rem;margin:1.4em 0 .3em}
.cartao{display:block;background:#fff;border:1px solid var(--linha);border-radius:12px;padding:16px 18px;margin-bottom:14px;text-decoration:none;color:inherit}
.cartao:hover{border-color:var(--azul)}
.cartao h2{margin:.2em 0}
.meta{font-size:.85rem;color:#5A636D}
.selo{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.76rem;font-weight:700;background:var(--azul-claro);color:var(--marinho)}
article p{margin:.7em 0}
.errata{border:1px solid #F1DDA5;background:#FFF4D9;color:#7A4E00;border-radius:8px;padding:10px 14px;margin:14px 0}
.fundamentacao{margin-top:34px;border-top:3px solid var(--marinho);padding-top:8px}
.fonte{border-left:4px solid var(--azul);background:#fff;border-radius:0 8px 8px 0;padding:10px 14px;margin:12px 0;font-size:.95rem}
.fonte blockquote{margin:8px 0 0;font-style:italic;color:#3C3A3B}
.aviso{font-size:.85rem;color:#5A636D;border-top:1px solid var(--linha);margin-top:30px;padding-top:12px}
.rodape{background:var(--marinho);color:#fff;padding:22px 16px;font-size:.9rem}
.rodape a{color:#fff}
.rodape .nome{font-family:"Playfair Display",serif;font-size:1.2rem}
.rodape .sub{color:#F3B9BB;letter-spacing:2px;font-size:.78rem}
img.capa{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:12px;margin:10px 0 18px}
.cartao.com-capa{display:grid;grid-template-columns:150px 1fr;column-gap:16px;align-items:start}
.cartao .mini{grid-row:1 / span 3;width:150px;height:104px;border-radius:8px;background:var(--azul-claro) center/cover no-repeat}
@media (max-width:560px){ .cartao.com-capa{grid-template-columns:1fr} .cartao .mini{grid-row:auto;width:100%;height:160px;margin-bottom:8px} }
.credito{text-align:right;font-style:italic;font-size:.93rem;margin:.3em 0}
.chamada{background:var(--azul-claro);border:1px solid #C9DDEE;border-radius:12px;padding:16px 18px;margin:26px 0 0;color:var(--marinho);display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.botao{display:inline-block;background:var(--marinho);color:#fff;text-decoration:none;border-radius:8px;padding:8px 16px;font-weight:700;margin:2px 4px 2px 0}
.botao.zap{background:#157A43}
.rolagem{overflow-x:auto}
.tabela-texto{border-collapse:collapse;margin:12px 0;font-size:.95rem}
.tabela-texto th,.tabela-texto td{border:1px solid #9AA7B4;padding:6px 10px;text-align:left;vertical-align:top}
.tabela-texto th{background:var(--azul-claro);color:var(--marinho)}
.vazio{background:#fff;border:1px dashed #B8C4D0;border-radius:12px;padding:26px;text-align:center}
</style>
</head>
<body>
<header class="topo"><div class="dentro">
  <a href="informa.html"><div class="marca">Artecon Informa</div>
  <div class="lema">Inteligência Contábil e Tributária — com fundamentação em fontes oficiais</div></a>
</div></header>
<nav class="cats" aria-label="Categorias"><div class="dentro" id="categorias"></div></nav>
<main id="conteudo"><p class="meta">Carregando…</p></main>
<footer class="rodape"><div class="dentro">
  <div class="nome">Artecon</div><div class="sub">artes contábeis</div>
  <p>Rua Livorno, nº 15, Sala 101 — Parque Residencial Pagani — Palhoça/SC — CEP 88132-274<br>
  (48) 3242-0530 · <a href="https://www.artecon.cnt.br" rel="noopener">www.artecon.cnt.br</a></p>
</div></footer>

<script src="radar-config.js"></script>
<script>
"use strict";
const CFG = window.RADAR_CONFIG || {};
const URL_BASE = String(CFG.SUPABASE_URL || "").replace(/\/+$/, "");
const CHAVE = String(CFG.SUPABASE_ANON_KEY || "");
const COLUNAS = "id,slug,titulo,corpo,formato,categoria,publicar_em,errata,fundamentacao,atualizado_em,imagem_id,autor,fonte_credito";
const FORMATOS = {flash:"Flash", informativo:"Informativo", artigo:"Artigo técnico"};

const $ = s => document.querySelector(s);
function h(v){ return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function data(v){ if(!v) return ""; const d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(v) ? v+"T12:00:00" : v); return isNaN(d) ? "" : d.toLocaleDateString("pt-BR", {day:"2-digit", month:"long", year:"numeric"}); }
function urlSegura(u){ return /^https?:\/\//i.test(String(u || "")) ? String(u) : ""; }

/* Texto → HTML seguro. Nada do texto entra como HTML: cada pedaço é escapado; os únicos
   elementos criados são subtítulos, listas, tabelas, negrito e links para endereços http(s). */
function renderTexto(t){
  const linhas = String(t ?? "").split(/\r?\n/); let html = "", lista = false, par = [], tab = [];
  const fechaTab = () => {
    if(tab.length > 1 && tab[1].every(c => /^:?-+:?$/.test(c))) tab.splice(1, 1);        // linha |---|---| logo abaixo do cabeçalho
    tab = tab.filter(cel => cel.some(c => c)); if(!tab.length) return;
    const n = Math.max(...tab.map(cel => cel.length));                                    // todas as linhas com o mesmo nº de colunas
    html += `<div class="rolagem"><table class="tabela-texto">` + tab.map((cel, i) => `<tr>${Array.from({length:n}, (_, k) => i ? `<td>${enfeita(cel[k] || "")}</td>` : `<th>${enfeita(cel[k] || "")}</th>`).join("")}</tr>`).join("") + "</table></div>"; tab = []; };
  const fechaPar = () => { if(par.length){ html += `<p>${par.join("<br>")}</p>`; par = []; } };
  const fechaLista = () => { if(lista){ html += "</ul>"; lista = false; } };
  const ligar = bruto => bruto.split(/(https?:\/\/[^\s<>"']+)/i).map((p, i) => {
    if(i % 2 === 0) return h(p);
    let fim = /[.,;:!?*)]*$/.exec(p)[0];                     // pontuação colada no fim não faz parte do endereço
    while(fim.includes(")") && p.slice(0, p.length - fim.length).split("(").length > p.slice(0, p.length - fim.length).split(")").length)
      fim = fim.slice(fim.indexOf(")") + 1);                 // …a não ser o ")" que fecha um "(" do próprio endereço
    const u = p.slice(0, p.length - fim.length);
    return `<a href="${h(u)}" target="_blank" rel="noopener noreferrer">${h(u)}</a>${h(fim)}`;
  }).join("");
  // negrito primeiro (sobre o texto bruto); dentro e fora dele, os endereços viram link
  const enfeita = bruto => bruto.split(/\*\*(\S|\S.*?\S)\*\*/).map((p, i) => i % 2 ? `<strong>${ligar(p)}</strong>` : ligar(p)).join("");
  for(const l of linhas){
    if(!/^\s*\|/.test(l)) fechaTab();
    if(/^\s*\|/.test(l)){ fechaPar(); fechaLista();
      tab.push(l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim())); }
    else if(/^##\s+/.test(l)){ fechaPar(); fechaLista(); html += `<h3>${enfeita(l.replace(/^##\s+/, ""))}</h3>`; }
    else if(/^#\s+/.test(l)){ fechaPar(); fechaLista(); html += `<h2>${enfeita(l.replace(/^#\s+/, ""))}</h2>`; }
    else if(/^[-•]\s+/.test(l)){ fechaPar(); if(!lista){ html += "<ul>"; lista = true; } html += `<li>${enfeita(l.replace(/^[-•]\s+/, ""))}</li>`; }
    else if(!l.trim()){ fechaPar(); fechaLista(); }
    else { fechaLista(); par.push(enfeita(l)); }
  }
  fechaPar(); fechaLista(); fechaTab(); return html;
}

const imagemValida = d => /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(String(d || ""));
async function imagem(id){ if(!id) return ""; try{ const [i] = await ler("radar_imagens", {select:"dados", id:"eq." + id}); return i && imagemValida(i.dados) ? i.dados : ""; }catch(e){ return ""; } }
function resumo(t, n = 230){
  const limpo = String(t || "").split(/\r?\n/).filter(l => l.trim() && !/^#{1,2}\s/.test(l) && !/^\s*\|/.test(l)).join(" ").replace(/\*\*/g, "").replace(/\s+/g, " ").trim();
  return limpo.length > n ? limpo.slice(0, n).replace(/\s+\S*$/, "") + "…" : limpo;
}
async function ler(tabela, params){
  const url = new URL(URL_BASE + "/rest/v1/" + tabela);
  for(const [k,v] of Object.entries(params)) url.searchParams.set(k, v);
  const r = await fetch(url, {headers:{apikey:CHAVE, Authorization:"Bearer " + CHAVE}});
  if(!r.ok) throw new Error("Não foi possível carregar o conteúdo agora. Tente novamente em instantes.");
  return r.json();
}

async function iniciar(){
  const q = new URLSearchParams(location.search), slug = q.get("p"), cat = q.get("c");
  const principal = $("#conteudo");
  let papel = ""; try{ papel = JSON.parse(atob(CHAVE.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).role || ""; }catch(e){}
  if(!/^https?:\/\//.test(URL_BASE) || CHAVE.startsWith("COLE_") || papel === "service_role" || /^sb_secret_/.test(CHAVE)){
    principal.innerHTML = `<div class="vazio">Página em configuração.</div>`; return; }
  try{
    const cats = await ler("radar_categorias", {select:"slug,nome", order:"ordem"});
    const nomes = Object.assign(Object.create(null), Object.fromEntries(cats.map(c => [c.slug, c.nome])));
    $("#categorias").innerHTML = `<a href="informa.html" class="${!cat && !slug ? "ativa" : ""}">Todas</a>` +
      cats.map(c => `<a href="informa.html?c=${encodeURIComponent(c.slug)}" class="${cat === c.slug ? "ativa" : ""}">${h(c.nome)}</a>`).join("");

    if(slug){
      const [p] = await ler("radar_publicacoes", {select:COLUNAS, slug:"eq." + slug});
      if(!p){ principal.innerHTML = `<div class="vazio"><h2>Publicação não encontrada</h2><p>Ela pode ter sido retirada ou o endereço está incorreto.</p><a href="informa.html">Ver todas as publicações</a></div>`; return; }
      document.title = p.titulo + " — Artecon Informa";
      const fontes = Array.isArray(p.fundamentacao) ? p.fundamentacao : [], capa = await imagem(p.imagem_id);
      principal.innerHTML = `<article>
        <p class="meta">${p.categoria ? `<span class="selo">${h(nomes[p.categoria] || p.categoria)}</span> ` : ""}${h(FORMATOS[p.formato] || "")} · ${h(data(p.publicar_em))}</p>
        <h1>${h(p.titulo)}</h1>
        ${p.errata ? `<div class="errata"><strong>Errata:</strong> ${h(p.errata)}</div>` : ""}
        ${capa ? `<img class="capa" src="${h(capa)}" alt="">` : ""}
        ${renderTexto(p.corpo)}
        ${p.autor ? `<p class="credito">Texto elaborado por: <strong>${h(p.autor)}</strong></p>` : ""}
        ${p.fonte_credito ? `<p class="credito">Fonte: ${h(p.fonte_credito)}</p>` : ""}
        <div class="chamada"><strong>Ficou com dúvida ou quer avaliar o impacto na sua empresa?</strong>
          <div><a class="botao" href="https://artecon.cnt.br/contact" target="_blank" rel="noopener">Fale conosco</a>
          <a class="botao zap" href="https://wa.me/554832420530" target="_blank" rel="noopener">WhatsApp</a></div></div>
        <section class="fundamentacao"><h2>Fundamentação e fontes oficiais</h2>
          ${fontes.length ? fontes.map(f => { const u = urlSegura(f.url); return `<div class="fonte">
              <strong>${h(f.orgao)}</strong>${f.norma ? ` — ${h(f.norma)}` : ""}${f.dispositivo ? `, ${h(f.dispositivo)}` : ""}<br>
              ${u ? `<a href="${h(u)}" target="_blank" rel="noopener noreferrer">${h(f.titulo || u)}</a>` : h(f.titulo)}${f.data ? ` <span class="meta">(${h(data(f.data))})</span>` : ""}
              <blockquote>“${h(f.trecho)}”</blockquote></div>`; }).join("")
            : `<p class="meta">Publicação sem trechos de fundamentação registrados.</p>`}
        </section>
        <p class="aviso">Conteúdo de caráter informativo, elaborado pela Artecon Artes Contábeis a partir das fontes oficiais indicadas.
          Não substitui a análise do caso concreto. Para avaliar o impacto na sua empresa, fale com a nossa equipe.</p>
        <p><a href="informa.html">← Todas as publicações</a></p></article>`;
      return;
    }

    const params = {select:COLUNAS, order:"publicar_em.desc", limit:"60"};
    if(cat) params.categoria = "eq." + cat;
    const itens = await ler("radar_publicacoes", params);
    const mais = itens.length >= 60 ? `<p class="meta">Mostrando as 60 publicações mais recentes${cat ? " desta categoria" : ""}. Use as categorias para encontrar as anteriores.</p>` : "";
    principal.innerHTML = `<h1>${h(cat ? (nomes[cat] || "Publicações") : "Últimas publicações")}</h1>` + (itens.length ? itens.map(p => `
      <a class="cartao${p.imagem_id ? " com-capa" : ""}" href="informa.html?p=${encodeURIComponent(p.slug)}">
        ${p.imagem_id ? `<span class="mini" data-imagem="${Number(p.imagem_id)}"></span>` : ""}
        <span class="meta">${p.categoria ? `<span class="selo">${h(nomes[p.categoria] || p.categoria)}</span> ` : ""}${h(data(p.publicar_em))}</span>
        <h2>${h(p.titulo)}</h2><span>${h(resumo(p.corpo))}</span></a>`).join("")
      : `<div class="vazio">Ainda não há publicações${cat ? " nesta categoria" : ""}.</div>`) + mais;
    // as capas da lista só são baixadas quando o cartão chega perto da tela
    const carregar = async el => { const d = await imagem(el.dataset.imagem); if(d) el.style.backgroundImage = `url("${d}")`; else { el.closest(".cartao")?.classList.remove("com-capa"); el.remove(); } };
    const olho = "IntersectionObserver" in window ? new IntersectionObserver(vistos => { for(const v of vistos) if(v.isIntersecting){ olho.unobserve(v.target); carregar(v.target); } }, {rootMargin:"300px"}) : null;
    document.querySelectorAll(".mini[data-imagem]").forEach(el => olho ? olho.observe(el) : carregar(el));
  }catch(e){ principal.innerHTML = `<div class="vazio">${h(e.message)}</div>`; }
}
iniciar();
</script>
</body>
</html>
