name: Radar — publicar no site

# Publica no site da Artecon SÓ as notícias que o administrador autorizou na tela do assunto (passo 4).
# v0.17.0: na mesma rodada, manda publicar o Instagram e o Facebook autorizados junto com o site ("Publicar em todos")
# e exclui do site as notícias que o administrador pediu para excluir (aba Publicações).
# Sem nada pendente, termina em segundos, sem entrar no site.
# Precisa dos segredos RADAR_SUPABASE_URL, RADAR_SUPABASE_SERVICE_KEY, ARTECON_SITE_USUARIO e ARTECON_SITE_SENHA.
# v0.19.0: a tela aciona este robô na hora (workflow_dispatch), pela função radar-redes, logo depois de autorizar ou de pedir
# uma exclusão. Para isso, o segredo RADAR_GITHUB_TOKEN fica no Supabase (Edge Functions → Secrets), nunca aqui no GitHub.
# O agendamento abaixo é só a reserva: o GitHub atrasa (às vezes em horas) os agendamentos frequentes, e a hora cheia é a
# mais disputada; por isso os minutos quebrados.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-site-publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Há autorização pendente?
        id: fila
        env:
          SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_KEY }}
        run: |
          pendente=nao
          for consulta in "radar_site_envios?select=id&situacao=in.(autorizado,enviando)&limit=1" \
                          "radar_redes_envios?select=id&situacao=eq.autorizado&junto_com_site=eq.true&limit=1" \
                          "radar_site_exclusoes?select=id&situacao=in.(pedido,excluindo)&limit=1"; do
            resposta=$(curl -sS --fail --max-time 30 \
              -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              "${SUPABASE_URL%/}/rest/v1/$consulta") || resposta="erro"
            if [ "$resposta" != "[]" ]; then pendente=sim; fi
          done
          echo "pendente=$pendente" >> "$GITHUB_OUTPUT"
      - if: steps.fila.outputs.pendente == 'sim'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - if: steps.fila.outputs.pendente == 'sim'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robo/requirements.txt
      - if: steps.fila.outputs.pendente == 'sim'
        run: pip install --require-hashes --no-deps -r robo/requirements.txt
      - name: Publicar o que foi autorizado (e excluir o que foi pedido)
        if: steps.fila.outputs.pendente == 'sim'
        working-directory: robo
        env:
          SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_KEY }}
          ARTECON_SITE_USUARIO: ${{ secrets.ARTECON_SITE_USUARIO }}
          ARTECON_SITE_SENHA: ${{ secrets.ARTECON_SITE_SENHA }}
        run: python radar_site_publicar.py
