name: Radar — testes

on:
  push:
    paths: ["robo/**", "sql/**", "testes/**", "supabase/**", "index.html", "informativo.html", "radar-pauta.js", "radar-config.js", ".gitignore", ".github/workflows/radar-testes.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 30                 # v0.21.0: a suíte passou de ~9 para ~14 min aqui (instalação à parte)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RADAR_PGHOST: localhost
      RADAR_PGPORT: "5432"
      RADAR_PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r robo/requirements.txt "psycopg[binary]" pytest playwright pillow
      # v0.22.0: ffmpeg para os testes do corretor de vídeo (testes/test_radar_video_robo.py, só com vídeos sintéticos; o teste do
      # contêiner monta robo/video/Dockerfile com o docker que já vem no runner)
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg
      - run: python -m playwright install --with-deps chromium
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Instalar PostgREST
        run: |
          curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar -xJ
          sudo mv postgrest /usr/local/bin/
      - run: python -m pytest testes -q
