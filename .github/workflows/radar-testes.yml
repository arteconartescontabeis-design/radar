name: Radar — testes

on:
  push:
    paths: ["robo/**", "sql/**", "testes/**", "supabase/**", "index.html", "informativo.html", "radar-pauta.js", "radar-video.js", "radar-setor.js", "radar-respostas.js", "radar-config.js", ".gitignore", ".github/workflows/radar-testes.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    # v0.22.0: fixo no 24.04, o Ubuntu do robô do vídeo: os testes do corretor foram medidos com o ffmpeg 6.1.1 dele (o mesmo do
    # robo/video/Dockerfile), e o Speech SDK da Azure só lista até a 24.04 (o ubuntu-latest passa a 26.04 em novembro de 2026)
    runs-on: ubuntu-24.04
    # v0.21.0: a suíte passou de ~9 para ~14 min aqui (instalação à parte); v0.22.0: 864 s aqui, com os testes do corretor de vídeo
    # (a montagem com o ffmpeg, a função radar-video no Deno e o contêiner); no GitHub, montar a imagem do robo/video/Dockerfile com o
    # apt soma 1 a 2 min
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RADAR_PGHOST: localhost
      RADAR_PGPORT: "5432"
      RADAR_PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.12"
      # pyyaml: o teste do modelo do workflow do corretor de vídeo (robo/video/workflow/radar-video.yml) lê o YAML
      - run: pip install --require-hashes --no-deps -r robo/requirements.txt
      - run: pip install "psycopg[binary]" pytest playwright pillow pyyaml
      # v0.22.0: o Python do robô de vídeo, com versão e hash (o Speech SDK da Azure): test_radar_video_transcrever.py roda o SDK de
      # verdade contra um servidor local do protocolo de fala (ws://127.0.0.1; nenhuma chamada à Azure)
      - run: pip install --require-hashes --no-deps -r robo/video/requirements.txt
      # v0.22.0: ffmpeg para os testes do corretor de vídeo (testes/test_radar_video_*.py, só com vídeos SINTÉTICOS, gerados na hora
      # numa pasta temporária; os testes do contêiner montam robo/video/Dockerfile com o docker que já vem no runner)
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg
      - run: python -m playwright install --with-deps chromium
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed   # v2.0.5
        with:
          deno-version: v2.x
      - name: Instalar PostgREST
        run: |
          curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar -xJ
          sudo mv postgrest /usr/local/bin/
      - run: python -m pytest testes -q
