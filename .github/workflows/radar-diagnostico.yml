name: Radar — diagnóstico das fontes

# Baixa as páginas reais e mostra o que o robô reconhece. Só lê: com as chaves do robô,
# confere as fontes ativas do banco; sem elas, as do arquivo robo/radar_fontes.json.
# v0.31.0: em "enderecos", o identificador de uma fonte (ex.: rfb-normas) confere essa fonte mesmo desligada (teste antes de ligar).
on:
  workflow_dispatch:
    inputs:
      enderecos:
        description: "Endereços para testar antes de cadastrar, ou identificadores de fontes (ex.: rfb-normas), mesmo desligadas; separe por espaço. Vazio = fontes ativas"
        required: false
        default: ""
      padrao:
        description: "Padrão dos links para os endereços testados (opcional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --no-deps -r robo/requirements.txt
      - name: Diagnosticar
        working-directory: robo
        env:
          SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_KEY }}
          ENDERECOS: ${{ github.event.inputs.enderecos }}
          PADRAO: ${{ github.event.inputs.padrao }}
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_SENHA: ${{ secrets.INLABS_SENHA }}
        run: python radar_diagnostico.py
      - name: Guardar páginas e relatório
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f   # v6.0.0
        with:
          name: radar-diagnostico
          path: robo/diagnostico/
          retention-days: 14
