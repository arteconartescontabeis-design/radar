name: Radar — diagnóstico das fontes

# Não usa banco nem chaves: baixa as páginas reais e mostra o que o robô reconhece.
on:
  workflow_dispatch:

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r robo/requirements.txt
      - name: Diagnosticar
        working-directory: robo
        run: python radar_diagnostico.py
      - name: Guardar páginas e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-diagnostico
          path: robo/diagnostico/
          retention-days: 14
