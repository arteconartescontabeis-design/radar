name: Radar — coleta das fontes oficiais

on:
  schedule:
    # a cada 6 horas (00:17, 06:17, 12:17 e 18:17 de Brasília)
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      fonte:
        description: "Slug de uma única fonte (vazio = todas)"
        required: false
        default: ""
      forcar:
        description: "Ignorar a frequência configurada"
        type: boolean
        default: true

concurrency:
  group: radar-coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write          # aviso (issue) de fonte que falhou 3 vezes seguidas; o GitHub manda e-mail
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robo/requirements.txt
      - run: pip install -r robo/requirements.txt
      - name: Coletar
        working-directory: robo
        timeout-minutes: 16      # o robô para sozinho em 13 min (RADAR_PRAZO_MINUTOS); os passos abaixo têm tempo garantido
        env:
          SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_KEY }}
          # token do aplicativo "radar" na IA Central (Portal → Consumo de IA); sem ele a coleta roda, só sem a nota da IA
          RADAR_IA_GATEWAY_TOKEN: ${{ secrets.RADAR_IA_GATEWAY_TOKEN }}
          # opcionais (Settings → Secrets and variables → Actions → Variables); vazias = padrão do robô
          RADAR_IA_MODELO: ${{ vars.RADAR_IA_MODELO }}
          RADAR_IA_MODELO_RAPIDO: ${{ vars.RADAR_IA_MODELO_RAPIDO }}
          IA_GATEWAY_URL: ${{ vars.IA_GATEWAY_URL }}
          RADAR_PRAZO_MINUTOS: ${{ vars.RADAR_PRAZO_MINUTOS }}
          # acesso ao INLABS (DOU completo); sem eles, a fonte do INLABS fica em falha e as demais seguem normais
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_SENHA: ${{ secrets.INLABS_SENHA }}
          FONTE: ${{ github.event.inputs.fonte }}
          FORCAR: ${{ github.event.inputs.forcar }}
        run: |
          ARGS=()
          if [ -n "$FONTE" ]; then ARGS+=(--fonte "$FONTE"); fi
          if [ "$FORCAR" = "true" ]; then ARGS+=(--forcar); fi
          python radar_coletar.py "${ARGS[@]}"
      - name: Registrar publicações encontradas no site
        if: always()
        working-directory: robo
        timeout-minutes: 4
        env:
          SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_KEY }}
        run: python radar_site.py
      - name: Avisar fontes com falha
        if: always()
        working-directory: robo
        timeout-minutes: 4
        env:
          SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python radar_alertas.py
