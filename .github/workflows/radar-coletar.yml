name: Radar — coleta das fontes oficiais

on:
  schedule:
    # a cada 6 horas (00:17, 06:17, 12:17 e 18:17 de Brasília)
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      fonte:
        description: "Slug de uma única fonte (vazio = todas)"
        required: false
        default: ""
      forcar:
        description: "Ignorar a frequência configurada"
        type: boolean
        default: true

concurrency:
  group: radar-coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write          # aviso (issue) de fonte que falhou 3 vezes seguidas; o GitHub manda e-mail
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robo/requirements.txt
      - run: pip install -r robo/requirements.txt
      - name: Coletar
        working-directory: robo
        env:
          SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_KEY }}
          # token do aplicativo "radar" na IA Central (Portal → Consumo de IA); sem ele a coleta roda, só sem a nota da IA
          RADAR_IA_GATEWAY_TOKEN: ${{ secrets.RADAR_IA_GATEWAY_TOKEN }}
          FONTE: ${{ github.event.inputs.fonte }}
          FORCAR: ${{ github.event.inputs.forcar }}
        run: |
          ARGS=""
          if [ -n "$FONTE" ]; then ARGS="$ARGS --fonte $FONTE"; fi
          if [ "$FORCAR" = "true" ]; then ARGS="$ARGS --forcar"; fi
          python radar_coletar.py $ARGS
      - name: Registrar publicações encontradas no site
        if: always()
        working-directory: robo
        env:
          SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_KEY }}
        run: python radar_site.py
      - name: Avisar fontes com falha
        if: always()
        working-directory: robo
        env:
          SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python radar_alertas.py
