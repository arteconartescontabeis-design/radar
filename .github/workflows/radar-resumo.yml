name: Radar — resumo semanal

on:
  schedule:
    # segunda-feira, 08:47 de Brasília (11:47 UTC)
    - cron: "47 11 * * 1"
  workflow_dispatch:

concurrency:
  group: radar-resumo
  cancel-in-progress: false

jobs:
  resumir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write          # o resumo é um aviso (issue); o GitHub manda o e-mail
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robo/requirements.txt
      - run: pip install -r robo/requirements.txt
      - name: Abrir o resumo da semana
        working-directory: robo
        env:
          SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python radar_resumo.py
